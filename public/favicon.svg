<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="13" fill="url(#bg)"/>
  <!-- Calendar body -->
  <rect x="10" y="14" width="44" height="36" rx="4" fill="white" opacity="0.93"/>
  <!-- Calendar header bar -->
  <rect x="10" y="14" width="44" height="8" rx="4" fill="#4f46e5"/>
  <!-- Knob 1 -->
  <rect x="19" y="12" width="4" height="6" rx="1" fill="white"/>
  <!-- Knob 2 -->
  <rect x="40" y="12" width="4" height="6" rx="1" fill="white"/>
  <!-- Check mark -->
  <polyline points="20,36 29,43 43,32" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>